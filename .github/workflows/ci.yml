name: CI

on:
  push:
  pull_request:

jobs:
  cli:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install CLI dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock.txt
          python -m pip install -e .[dev]

      - name: Verify Flask is not part of the base install
        run: |
          python - <<'PY'
          import importlib.util
          assert importlib.util.find_spec("flask") is None
          PY

      - name: Entrypoint smoke test
        env:
          MPLBACKEND: Agg
        run: |
          monte-carlo --help
          monte-carlo simulate --help
          monte-carlo backtest --help
          monte-carlo simulate AAPL --source offline --data-path sample_data --days 5 --scenarios 10
          monte-carlo backtest AAPL --source offline --data-path sample_data --lookback 5 --hold 3 --rebalance 3 --top 1 --scenarios 10
          monte-carlo-ui > ui.out 2>&1 || test $? -eq 2
          grep -F "Install \`python3 -m pip install -e .[ui]\`" ui.out

      - name: Lint
        run: flake8 .

      - name: Tests
        env:
          MPLBACKEND: Agg
        run: pytest -q

  ui:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install UI dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock.txt
          python -m pip install -e .[dev,ui]

      - name: Browser UI tests
        env:
          MPLBACKEND: Agg
        run: pytest tests/test_web_ui.py -q

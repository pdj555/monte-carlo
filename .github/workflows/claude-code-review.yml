name: Claude Code Review

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to review"
        required: true
        type: string

concurrency:
  group: claude-review-${{ inputs.pr_number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Configure AI credentials
        uses: ./.github/actions/configure-ai
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ollama_api_key: ${{ secrets.OLLAMA_API_KEY }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Resolve PR head SHA
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          sha=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)
          if [ -z "$sha" ]; then
            echo "Could not resolve head SHA for PR #$PR_NUMBER" >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Claude profit-focused review
        id: review
        uses: anthropics/claude-code-action@v1
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.OLLAMA_API_KEY }}
          ANTHROPIC_BASE_URL: ${{ env.ANTHROPIC_BASE_URL }}
          ANTHROPIC_DEFAULT_SONNET_MODEL: ${{ env.ANTHROPIC_DEFAULT_SONNET_MODEL }}
          ANTHROPIC_DEFAULT_OPUS_MODEL: ${{ env.ANTHROPIC_DEFAULT_OPUS_MODEL }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          OPENAI_BASE_URL: ${{ env.OPENAI_BASE_URL }}
          OLLAMA_BASE_URL: ${{ env.OLLAMA_BASE_URL }}
          OLLAMA_MODEL: ${{ env.OLLAMA_MODEL }}
          OPENAI_MODEL: ${{ env.OPENAI_MODEL }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: true
          prompt: "/profit-review REPO: ${{ github.repository }} PR: ${{ inputs.pr_number }} SHA: ${{ steps.pr.outputs.sha }}"
          claude_args: |
            --model claude-opus-4-6
            --max-turns 8
            --allowedTools "Read,Grep,Glob,Bash(git diff:*),Bash(git log:*),Bash(pytest -q),Bash(flake8 .),mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

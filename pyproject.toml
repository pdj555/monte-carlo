[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "monte-carlo-sim"
version = "0.1.0"
description = "Monte Carlo decision engine for simulation, backtesting, and a lean browser UI."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Preston Jones" }]
dependencies = [
  "matplotlib",
  "numpy",
  "pandas",
  "seaborn",
  "yfinance",
]

[project.optional-dependencies]
dev = ["flake8", "pytest"]
ui = ["Flask"]
agents = ["claude-agent-sdk", "openai-agents"]

[project.scripts]
monte-carlo = "public_cli:main"
monte-carlo-ui = "app:main"
monte-carlo-mcp = "mcp_server:serve"

[tool.setuptools]
py-modules = [
  "agent_integrations",
  "agent_workflow",
  "analysis",
  "ai",
  "app",
  "backtest",
  "cli",
  "cli_shared",
  "data",
  "decision",
  "legacy_cli",
  "mcp_server",
  "public_cli",
  "sdk",
  "simulate_cli",
  "simulation",
  "viz",
]

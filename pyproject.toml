[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "monte-carlo-sim"
version = "0.1.0"
description = "Monte Carlo decision engine for simulation, backtesting, and a lean browser UI."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Preston Jones" }]
dependencies = [
  "Flask",
  "matplotlib",
  "numpy",
  "pandas",
  "seaborn",
  "yfinance",
]

[project.optional-dependencies]
dev = ["flake8", "pytest"]

[project.scripts]
monte-carlo = "public_cli:main"
monte-carlo-ui = "app:main"

[tool.setuptools]
py-modules = ["analysis", "ai", "app", "backtest", "cli", "cli_shared", "data", "decision", "public_cli", "simulate_cli", "simulation", "viz"]
